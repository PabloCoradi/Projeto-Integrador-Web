services:
  db:
    image: postgres:16-alpine
    container_name: sistema_advocacia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_advocacia}
    ports:
      - "5432:5432"
    volumes:
      # Volume nomeado: fica só na máquina de quem rodou o "docker compose up".
      # Ninguém compartilha dados com ninguém, cada dev tem o seu.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: