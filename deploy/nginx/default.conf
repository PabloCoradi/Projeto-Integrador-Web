gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# ============================================================
# SITE  ->  http://IP_DA_VM  (porta 80)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/www/site;
    index index.html;

    # Chamadas da API: o Nginx repassa ao backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Verificação rápida de que o backend está de pé
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # React Router: qualquer outro caminho devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# SISTEMA  ->  http://IP_DA_VM:8080  (porta 8080)
# ============================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/www/sistema;
    index index.html;

    # Anexos dos casos: aceita arquivos de até 500 MB (com folga)
    client_max_body_size 520m;
    client_body_timeout 900s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads grandes: não guarda o arquivo inteiro antes de repassar
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # React Router: qualquer outro caminho devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
